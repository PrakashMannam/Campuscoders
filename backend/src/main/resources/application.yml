campuscoders:
  github:
    token: ${GITHUB_TOKEN:}
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:}
  # Brevo HTTPS API — verify a Gmail/sender address in Brevo (no custom domain required).
  brevo:
    api-key: ${BREVO_API_KEY:}
  # Optional prod bootstrap (Railway). Remove ADMIN_PASSWORD after first login.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Campus Admin}
  # Idempotent curated catalog seed on boot (set CATALOG_SEED=false to skip).
  catalog:
    seed: ${CATALOG_SEED:true}

spring:
  application:
    name: campuscoders-backend
  # Local default is "dev" (seeds admin/student). Set SPRING_PROFILES_ACTIVE=prod on a host.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campuscoders}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Fail fast on hosts that block outbound SMTP (Railway Hobby/Trial).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Railway (and most PaaS hosts) inject PORT; default 8080 for local.
server:
  port: ${PORT:8080}

# spring-dotenv: reads a file named ".env" from the process working directory
# (normally backend/ when you run mvn spring-boot:run). OS env vars still win.

jwt:
  secret: ${JWT_SECRET:campus-coders-secret-key-campus-coders-secret-key}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
