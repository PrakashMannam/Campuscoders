campuscoders:
  github:
    token: ${GITHUB_TOKEN:}
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:}

spring:
  application:
    name: campuscoders-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campuscoders}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:campus-coders-secret-key-campus-coders-secret-key}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
