# Used when Root Directory is the repo root (monorepo).
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Must match the JAR path inside the Docker image (see backend/Dockerfile).
# Do NOT use target/*.jar — that path does not exist in the runtime image.
startCommand = "java -jar app.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
