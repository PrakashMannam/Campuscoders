<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Campus Coders is a student-focused learning and collaboration platform."
    />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <title>Campus Coders</title>

    <style>
      /* ── Page Loading Splash Screen ── */
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8F9FC;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo icon container */
      .splash-icon {
        width: 100px;
        height: 100px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 8px 32px rgba(212, 175, 55, 0.18),
          0 2px 8px rgba(0, 0, 0, 0.08);
        animation: iconPulse 2s infinite ease-in-out;
        margin-bottom: 28px;
      }
      .splash-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      @keyframes iconPulse {
        0%, 100% {
          transform: scale(1);
          box-shadow:
            0 8px 32px rgba(212, 175, 55, 0.18),
            0 2px 8px rgba(0, 0, 0, 0.08);
        }
        50% {
          transform: scale(1.06);
          box-shadow:
            0 12px 48px rgba(212, 175, 55, 0.3),
            0 4px 16px rgba(0, 0, 0, 0.1);
        }
      }

      /* Brand text */
      .splash-brand {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: fadeUp 0.7s 0.3s ease forwards;
      }
      .splash-brand .campus { color: #0F1115; }
      .splash-brand .coders { color: #D4AF37; }

      /* Tagline */
      .splash-tag {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #B8972E;
        margin-top: 6px;
        opacity: 0;
        animation: fadeUp 0.7s 0.5s ease forwards;
      }

      /* Loading dots */
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 36px;
        opacity: 0;
        animation: fadeUp 0.5s 0.7s ease forwards;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #D4AF37;
        animation: dotBounce 1.4s infinite ease-in-out;
      }
      .splash-dots span:nth-child(1) { animation-delay: 0s; }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- Splash loading screen -->
    <div id="splash-loader">
      <div class="splash-icon">
        <img src="%PUBLIC_URL%/favicon.png" alt="Campus Coders" />
      </div>
      <div class="splash-brand">
        <span class="campus">Campus</span><span class="coders">Coders</span>
      </div>
      <div class="splash-tag">Code • Collaborate • Grow</div>
      <div class="splash-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
